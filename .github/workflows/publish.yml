name: publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # Tag v1.2.0 -> mod_version 1.2.0, so gradle.properties and the release
      # tag cannot drift apart.
      - name: Derive version from tag
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build -Pmod_version="$MOD_VERSION"

      # Loaders, Minecraft version and dependencies are read from
      # src/main/resources/fabric.mod.json.
      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: autosellmod
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: build/libs/!(*-sources).jar
          version: ${{ env.MOD_VERSION }}
          name: ${{ github.event.release.name }}
          changelog: ${{ github.event.release.body }}
